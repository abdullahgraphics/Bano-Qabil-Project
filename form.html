<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Abdullah Graphics</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0c1425;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar {
            height: 62px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: #0c1425;
            border-bottom: 1px solid rgba(100, 130, 170, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .logo-name {
            background: linear-gradient(90deg, #2998e8, #2bc27d);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            color: #f2f2f2;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a7b5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #2998e8;
        }

        /* =========================
           CONTACT SECTION
        ========================= */
        .contact-section {
            min-height: calc(100vh - 62px);
            padding: 40px 24px 80px;
            background: #0c1425;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(80, 110, 150, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(80, 110, 150, 0.035) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .contact-container {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .section-label {
            text-align: center;
            color: #2998e8;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 5px;
            margin-bottom: 8px;
        }

        .contact-title {
            text-align: center;
            font-size: 42px;
            line-height: 1.2;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .contact-title span {
            background: linear-gradient(90deg, #2998e8, #28bd83);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-subtitle {
            text-align: center;
            color: #7895c0;
            font-size: 15px;
            margin-bottom: 50px;
        }

        /* GRID LAYOUT */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: start;
        }

        /* INFO CARDS */
        .info-card {
            background: rgba(15, 27, 49, 0.55);
            border: 1px solid rgba(100, 130, 170, 0.25);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .info-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #152b55;
            color: #398fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .info-text h3 {
            font-size: 14px;
            color: #718bae;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .info-text p, .info-text a {
            font-size: 16px;
            color: #f2f2f2;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .info-text a:hover {
            color: #2998e8;
        }

        /* FORM STYLING */
        .contact-form-box {
            background: rgba(15, 27, 49, 0.55);
            border: 1px solid rgba(100, 130, 170, 0.25);
            border-radius: 12px;
            padding: 36px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8da4c4;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: #09101f;
            border: 1px solid rgba(100, 130, 170, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #2998e8;
            box-shadow: 0 0 10px rgba(41, 152, 232, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2998e8, #28bd83);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(41, 152, 232, 0.3);
        }

        /* RESPONSIVE */
        @media (max-width: 850px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .navbar { padding: 0 15px; }
            .logo { font-size: 16px; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 9px; letter-spacing: 0.5px; }
            .contact-title { font-size: 32px; }
            .contact-form-box { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-name">Abdullah</span>
            <span class="logo-text">Graphics</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="portfolio.html">PORTFOLIO</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="services.html">SERVICES</a></li>
            <li><a href="contact.html" class="active">CONTACT</a></li>
        </ul>
    </nav>

    <!-- CONTACT SECTION -->
    <section class="contact-section">
        <div class="contact-container">
            <div class="section-label">GET IN TOUCH</div>

            <h1 class="contact-title">
                Let's Work <span>Together</span>
            </h1>

            <p class="contact-subtitle">
                Have a project in mind? Reach out and let's create something extraordinary.
            </p>

            <div class="contact-grid">
                
                <!-- CONTACT INFO -->
                <div class="info-card">
                    <div class="info-item">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                        <div class="info-text">
                            <h3>Email</h3>
                            <a href="mailto:abdullah@example.com">abdullahgraphics@gmail.com</a>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </div>
                        <div class="info-text">
                            <h3>Phone / WhatsApp</h3>
                            <p>+92 300 0000000</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                        </div>
                        <div class="info-text">
                            <h3>Location</h3>
                            <p>Pakistan</p>
                        </div>
                    </div>
                </div>

                <!-- CONTACT FORM -->
                <div class="contact-form-box">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email address" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" class="form-control" placeholder="Project details or topic">
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" class="form-control" placeholder="Tell me about your project..." required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
