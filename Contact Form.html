<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Abdullah Graphics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0c1425;
            color: #ffffff;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            height: 62px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: #0c1425;
            border-bottom: 1px solid rgba(100, 130, 170, 0.15);
        }

        .logo {
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .logo-name {
            color: #2998e8;
        }

        .logo-text {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a7b5;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a.active {
            color: #2998e8;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7895c0;
            margin-bottom: 40px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .info-box, .form-box {
            background: #111d35;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(100, 130, 170, 0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #8da4c4;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #09101f;
            border: 1px solid rgba(100, 130, 170, 0.3);
            border-radius: 5px;
            color: #ffffff;
            font-size: 14px;
        }

        textarea.form-control {
            height: 100px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2998e8;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d82cb;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-name">Abdullah</span>
            <span class="logo-text">Graphics</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="portfolio.html">PORTFOLIO</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="services.html">SERVICES</a></li>
            <li><a href="Contact%20Form.html" class="active">CONTACT</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="title">Get In Touch</h1>
        <p class="subtitle">Have a project in mind? Let's work together.</p>

        <div class="content-grid">
            <div class="info-box">
                <h2 style="margin-bottom: 15px; color: #2998e8;">Contact Details</h2>
                <p><strong>Email:</strong><br>abdullahgraphics@gmail.com</p>
                <br>
                <p><strong>Location:</strong><br>Pakistan</p>
            </div>

            <div class="form-box">
                <form action="https://formspree.io/f/xljelgrd" method="POST">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" class="form-control" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
