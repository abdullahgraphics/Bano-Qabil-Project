<div class="contact-form-box">
    <div class="contact-form-box">
    <form action="https://formspree.io/f/xljelgrd" method="POST">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" class="form-control" placeholder="Project details or topic">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" class="form-control" placeholder="Tell me about your project..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>
</div>
