<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Graphics | Home</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0c1425;
            color: white;
            overflow-x: hidden;
        }

        /* FIXED NAVBAR */
        .navbar {
            width: 100%;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: #0c1425;
            border-bottom: 1px solid rgba(80, 110, 150, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo-name {
            background: linear-gradient(90deg, #2998e8, #2db8a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            color: #f1f1f1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
            list-style: none;
        }

        .nav-links a {
            color: #9da6b5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #2998e8;
        }

        /* HERO SECTION */
        .hero {
            width: 100%;
            min-height: calc(100vh - 62px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 8% 60%, rgba(29, 74, 155, 0.45), transparent 35%),
                radial-gradient(circle at 92% 55%, rgba(18, 126, 116, 0.35), transparent 35%),
                #0c1425;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(80, 110, 150, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(80, 110, 150, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
        }

        .availability {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 16px;
            border: 1px solid rgba(95, 126, 170, 0.35);
            border-radius: 30px;
            background: rgba(15, 25, 45, 0.35);
            color: #8194b3;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 35px;
        }

        .availability-dot {
            width: 8px;
            height: 8px;
            background: #1dbb73;
            border-radius: 50%;
        }

        .hero-title {
            font-size: clamp(55px, 8vw, 96px);
            line-height: 0.98;
            font-weight: 800;
            letter-spacing: -3px;
        }

        .gradient-text {
            display: block;
            background: linear-gradient(90deg, #2998e8 0%, #2da9c1 45%, #25c278 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .white-text {
            display: block;
            color: #f4f5f7;
            margin-top: 8px;
        }

        .subtitle {
            margin-top: 30px;
            color: #7690b8;
            font-size: 20px;
            font-weight: 400;
        }

        .portfolio-btn {
            margin-top: 38px;
            width: 219px;
            height: 53px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 13px;
            border: none;
            background: linear-gradient(90deg, #3596e9, #20c574);
            color: #071323;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.3px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .portfolio-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 157, 215, 0.25);
        }

        .down-arrow {
            margin-top: 63px;
            width: 10px;
            height: 10px;
            border-right: 2px solid #2998e8;
            border-bottom: 2px solid #2998e8;
            transform: rotate(45deg);
            animation: arrowMove 1.5s infinite ease-in-out;
        }

        @keyframes arrowMove {
            0% { transform: rotate(45deg) translate(0, 0); opacity: 0.5; }
            50% { transform: rotate(45deg) translate(4px, 4px); opacity: 1; }
            100% { transform: rotate(45deg) translate(0, 0); opacity: 0.5; }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 700px) {
            .navbar { padding: 0 15px; }
            .logo { font-size: 16px; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 9px; letter-spacing: 0.5px; }
            .hero-content { padding: 30px 15px; }
            .availability { font-size: 12px; margin-bottom: 28px; }
            .subtitle { font-size: 15px; line-height: 1.6; max-width: 90%; }
            .portfolio-btn { width: 200px; height: 50px; }
            .down-arrow { margin-top: 50px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-name">Abdullah</span>
            <span class="logo-text">Graphics</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="portfolio.html">PORTFOLIO</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="services.html">SERVICES</a></li>
            <li><a href="Contact Form.html">CONTACT</a></li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <div class="availability">
                <span class="availability-dot"></span>
                Available for freelance projects
            </div>

            <h1 class="hero-title">
                <span class="gradient-text">Abdullah</span>
                <span class="white-text">Graphics</span>
            </h1>

            <p class="subtitle">
                Creative Graphic Designer | Logos, Flyers, Business Cards
            </p>

            <a href="portfolio.html" class="portfolio-btn">
                VIEW PORTFOLIO
            </a>

            <div class="down-arrow"></div>
        </div>
    </section>

    <!-- EXTERNAL JAVASCRIPT LINK -->
    <script src="script.js"></script>
</body>
</html>
